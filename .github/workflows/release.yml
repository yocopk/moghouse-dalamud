name: Release

# Publishes a build and refreshes the custom Dalamud repository manifest.
# Triggered by pushing a version tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      OUT_DIR: MogHouseCompanion/bin/x64/Release/MogHouseCompanion

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Resolve version
        id: version
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Tag '${{ github.ref_name }}' is not a version tag (expected vMAJOR.MINOR.PATCH)."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build --configuration Release -p:Version=${{ steps.version.outputs.version }}

      - name: Generate repo.json
        run: |
          $manifest = Get-Content "$env:OUT_DIR/MogHouseCompanion.json" -Raw | ConvertFrom-Json
          $download = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/latest.zip"

          $manifest | Add-Member -Force -NotePropertyName DownloadLinkInstall -NotePropertyValue $download
          $manifest | Add-Member -Force -NotePropertyName DownloadLinkUpdate  -NotePropertyValue $download
          $manifest | Add-Member -Force -NotePropertyName DownloadLinkTesting -NotePropertyValue $download
          $manifest | Add-Member -Force -NotePropertyName IsHide -NotePropertyValue $false
          $manifest | Add-Member -Force -NotePropertyName IsTestingExclusive -NotePropertyValue $false
          $manifest | Add-Member -Force -NotePropertyName LastUpdate -NotePropertyValue ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())

          ConvertTo-Json @($manifest) -Depth 10 | Set-Content repo.json -Encoding utf8

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "$env:OUT_DIR/latest.zip" --generate-notes

      - name: Commit repo.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "repo.json unchanged, nothing to commit."
          } else {
            git commit -m "chore(release): repo.json for ${{ github.ref_name }}"
            git push origin HEAD:main
          }
